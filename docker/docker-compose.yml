
volumes:
  paperclip-data:
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${DB_USER:-bandung}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-bandung}"
      POSTGRES_DB: "${DB_NAME:-paperclip}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "${DB_PORT:-8989}:5432"
    volumes:
      - ${DB_PATH:-./data}:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://bandung:bandung@db:5432/paperclip}"
      PORT: "${PAPERCLIP_PORT:-3100}"
      SERVE_UI: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_DEFAULT_MODEL: "${OPENAI_DEFAULT_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL:-}"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "${ANTHROPIC_DEFAULT_OPUS_MODEL:-}"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      PAPERCLIP_AGENT_JWT_SECRET: "${PAPERCLIP_AGENT_JWT_SECRET:-some-random-secret-here}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
      - ${APP_HOME:-./repos}:/home/node/repos
    depends_on:
      db:
        condition: service_healthy
